set -g default-terminal "screen-256color"

set -g prefix C-s
unbind C-b
bind-key C-s send-prefix


bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5

bind -r m resize-pane -Z # Maximize the current pane

set -g mouse on

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'christoomey/vim-tmux-navigator' # for navigating panes and vim/nvim with Ctrl-hjkl
set -g @plugin 'jimeh/tmux-themepack' # to configure tmux theme
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions every 15 minutes
#
set -g @themepack 'powerline/default/cyan'  # set tmux theme to powerline default cyan
#
set -g @resurrect-capture-pane-contents 'on' # allow tmux-ressurect to capture pane contents
set -g @continuum-restore 'off' # enable tmux-continuum functionality

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"

unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode after dragging with mouse

# default mod
bind c new-window -c "#{pane_current_path}"

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

# util
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# popup for current pane
unbind p
# Toggle current pane into a popup
bind p run-shell '
  # Define the hidden session name
  popup_session="popup_pane_storage"
  
  # Ensure the storage session exists
  tmux has-session -t "$popup_session" 2>/dev/null || tmux new-session -d -s "$popup_session"

  # Capture current window and pane IDs
  curr_window=$(tmux display-message -p "#{window_id}")
  curr_pane=$(tmux display-message -p "#{pane_id}")

  # 1. Swap the current pane into the storage session
  tmux swap-pane -s "$curr_pane" -t "$popup_session":0.0

  # 2. Open the popup and attach to that storage session
  # The -E flag ensures the popup closes properly on detach
  tmux display-popup -w 90% -h 90% -E "tmux attach-session -t $popup_session"

  # 3. CRITICAL: Swap it back to the specific window it came from
  tmux swap-pane -s "$popup_session":0.0 -t "$curr_window"
  
  # 4. Ensure we are looking at the right window
  tmux select-window -t "$curr_window"
'

run '~/.tmux/plugins/tpm/tpm'

# Make sure you run `prefix + I` within the tmux session to install tmux plugins.

set-option -g status-right ""
